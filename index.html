<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f4ef">
  <meta name="description" content="离线健身训练计划与记录工具">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>练习簿 · 健身记录</title>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#home" aria-label="练习簿首页"><span class="brand-mark">练</span><span>练习簿</span></a>
    <div class="top-actions"><button class="icon-btn" id="installBtn" hidden title="安装到主屏幕">↓</button><button class="icon-btn" id="backupBtn" title="数据备份">⇧</button></div>
  </header>
  <main id="app" class="shell"></main>
  <nav class="tabbar" aria-label="主导航">
    <a href="#home" data-tab="home"><span>⌂</span>训练</a>
    <a href="#calendar" data-tab="calendar"><span>▦</span>日历</a>
    <a href="#history" data-tab="history"><span>↗</span>动作历史</a>
    <a href="#settings" data-tab="settings"><span>⚙</span>设置</a>
  </nav>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
